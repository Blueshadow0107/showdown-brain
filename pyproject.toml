[project]
name = "showdown-brain"
version = "0.1.0"
description = "battle AI for pokemon showdown random battles, learned from replays"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "poke-env>=0.16.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sb"]
